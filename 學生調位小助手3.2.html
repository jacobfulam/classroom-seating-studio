function pdfFromCanvas(canvas){const jpeg=atob(canvas.toDataURL('image/jpeg',.97).split(',')[1]),image=new Uint8Array(jpeg.length);for(let i=0;i<jpeg.length;i++)image[i]=jpeg.charCodeAt(i);const encode=s=>new TextEncoder().encode(s),parts=[],offset=[0];let size=0;function append(a){parts.push(a);size+=a.length}function text(s){append(encode(s))}text('%PDF-1.4\n');function object(id,body){offset[id]=size;text(id+' 0 obj\n'+body+'\nendobj\n')}object(1,'<< /Type /Catalog /Pages 2 0 R >>');object(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');object(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 841.89 595.28] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');offset[4]=size;text(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${canvas.width} /Height ${canvas.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${image.length} >>\nstream\n`);append(image);text('\nendstream\nendobj\n');const stream='q\n841.89 0 0 595.28 0 0 cm\n/Im0 Do\nQ\n';object(5,'<< /Length '+encode(stream).length+' >>\nstream\n'+stream+'endstream');const start=size;text('xref\n0 6\n0000000000 65535 f \n');for(let i=1;i<=5;i++)text(String(offset[i]).padStart(10,'0')+' 00000 n \n');text('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+start+'\n%%EOF');return new Blob(parts,{type:'application/pdf'})}
$('pdfBtn').onclick=()=>{try{const canvas=exportCanvas();if(!canvas)return;download(pdfFromCanvas(canvas),tr("{0}-第{1}期座位表.pdf",byId().name,shownPeriod().number));toast(tr("PDF 已產生"))}catch(e){toast(tr("PDF 未能產生，請再試或使用列印。"))}};
function preparePrint(){if(page!=='class'||!shownPeriod())return false;const canvas=exportCanvas(),img=node('img');img.alt=tr("班級座位表");img.src=canvas.toDataURL('image/png');$('printArea').replaceChildren(img);return true}$('printBtn').onclick=async()=>{if(preparePrint()){try{await document.querySelector('#printArea img').decode()}catch(e){}window.print()}};window.addEventListener('beforeprint',preparePrint);
let resizeTimer,lastLayoutWidth=document.documentElement.clientWidth;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{const width=document.documentElement.clientWidth;if(Math.abs(width-lastLayoutWidth)<2)return;lastLayoutWidth=width;if(page==='work'&&draft)renderWorkRoom();if(page==='class')renderClass()},180)});window.addEventListener('beforeunload',()=>{if(draft)stash()});
// Keep solver inputs stable while it yields to the browser.
document.addEventListener('click',e=>{if(busy&&!e.target.closest('#cancelSolve')){e.stopImmediatePropagation();e.preventDefault()}},true);

function switchLanguage(){if(busy)return;const inputValues={};for(const id of ['lineCount','fixtureType']){const input=$(id);if(input)inputValues[id]=input.value}const scrolls=['workRoom','rosterList'].map(id=>[$(id),$(id).scrollTop,$(id).scrollLeft]);language=language==='en'?'zh':'en';try{localStorage.setItem('fusir-seating-language',language)}catch(e){}translateStatic();clearTimeout(toastTimer);$('toast').classList.add('hidden');reportText='';if(page==='home')renderHome();else if(page==='class')renderClass();else renderWork();for(const [id,value]of Object.entries(inputValues))if($(id))$(id).value=value;for(const [el,top,left]of scrolls){el.scrollTop=top;el.scrollLeft=left}updateSoundButtons();$('saveState').textContent=saveFailed?tr('無法自動儲存，請匯出備份。'):tr('已自動儲存');$('draftStatus').textContent=saveFailed?tr('儲存空間不足，請匯出備份'):tr('草稿已自動保存');$('printArea').replaceChildren();}
$('languageBtn').onclick=switchLanguage;
translateStatic();
renderHome();if(needsMigrationSave)save();else if(storageProblem){$('saveState').textContent=storageProblem==='invalid'?tr('已偵測到未識別資料，停止覆寫。'):tr('資料未自動儲存；請匯出全部備份。')}else $('saveState').textContent=tr('已自動儲存');
</script></body></html>
